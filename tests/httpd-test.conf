# Configuração exclusiva do XAMPP local, porta separada da instalação normal.
ServerRoot "D:/xampp/apache"
Listen 127.0.0.1:18086
ServerName localhost
PidFile "D:/xampp/htdocs/rastreio-ti/.runtime/httpd-test.pid"
ErrorLog "D:/xampp/htdocs/rastreio-ti/.runtime/apache-test.log"
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php_module "D:/xampp/php/php8apache2_4.dll"
PHPIniDir "D:/xampp/php"
TypesConfig conf/mime.types
DocumentRoot "D:/xampp/htdocs/rastreio-ti"
DirectoryIndex index.php
<Directory "D:/xampp/htdocs/rastreio-ti">
    AllowOverride All
    Require all granted
</Directory>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
php_value session.save_path "D:/xampp/htdocs/rastreio-ti/.runtime/sessions"
